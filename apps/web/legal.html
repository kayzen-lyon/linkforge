<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="meta.title"></title>
    <meta name="description" data-i18n-attr="content:meta.description" />
    <!--@head-->
  </head>
  <body>
    <!--@header-->

    <main id="main" class="page-main" tabindex="-1">
      <div class="prose-page rich mx-auto max-w-4xl px-4 pt-10 pb-8 sm:px-6 md:pt-14">
        <header class="flex flex-col gap-4 pb-10">
          <!--@breadcrumb-->
          <h1 data-i18n="title"></h1>
          <p class="text-sm text-muted-foreground" data-i18n="updated"></p>
          <p class="lead" data-i18n="intro"></p>
        </header>
        <section aria-labelledby="l-publisher">
          <h2 id="l-publisher" data-i18n="publisher.title"></h2>
          <p data-i18n="publisher.p"></p>
          <ul class="plain-list"><li data-i18n="publisher.form"></li><li data-i18n="publisher.seat"></li><li data-i18n="publisher.office"></li><li data-i18n="publisher.siret"></li><li data-i18n="publisher.siren"></li><li data-i18n="publisher.ape"></li><li data-i18n="publisher.vat"></li><li data-i18n="publisher.phone"></li><li data-i18n="publisher.email"></li></ul>
        </section>
        <section aria-labelledby="l-director">
          <h2 id="l-director" data-i18n="director.title"></h2>
          <p data-i18n="director.p"></p>
        </section>
        <section aria-labelledby="l-host">
          <h2 id="l-host" data-i18n="host.title"></h2>
          <p data-i18n="host.p"></p>
        </section>
        <section aria-labelledby="l-software">
          <h2 id="l-software" data-i18n="software.title"></h2>
          <p data-i18n="software.p"></p>
        </section>
        <section aria-labelledby="l-privacy">
          <h2 id="l-privacy" data-i18n="privacy.title"></h2>
          <p data-i18n="privacy.none"></p>
          <h3 data-i18n="storage.title"></h3>
          <p data-i18n="storage.p"></p>
          <div class="ref-table-wrap"><table class="ref-table">
            <thead><tr><th scope="col" data-i18n="storage.th.key"></th><th scope="col" data-i18n="storage.th.purpose"></th></tr></thead>
            <tbody>
              <tr><th scope="row"><code class="param-name">omnillink-theme</code></th><td data-i18n="storage.theme"></td></tr>
              <tr><th scope="row"><code class="param-name">omnillink-lang</code></th><td data-i18n="storage.lang"></td></tr>
              <tr><th scope="row"><code class="param-name">omnillink-a11y</code></th><td data-i18n="storage.a11y"></td></tr>
            </tbody>
          </table></div>
          <h3 data-i18n="demo.title"></h3>
          <ul><li data-i18n="demo.1"></li><li data-i18n="demo.2"></li><li data-i18n="demo.3"></li></ul>
          <h3 data-i18n="logs.title"></h3>
          <p data-i18n="logs.p"></p>
        </section>
        <section aria-labelledby="l-rights">
          <h2 id="l-rights" data-i18n="rights.title"></h2>
          <p data-i18n="rights.p"></p>
        </section>
        <p class="border-t border-border pt-6 text-sm text-muted-foreground" data-i18n="disclaimer"></p>
      </div>
    </main>

    <!--@footer-->
    <script type="module" src="/src/page.ts"></script>
  </body>
</html>
