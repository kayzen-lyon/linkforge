<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="meta.title"></title>
    <meta name="description" data-i18n-attr="content:meta.description" />
    <!--@head-->
  </head>
  <body>
    <!--@header-->

    <main id="main" class="page-main" tabindex="-1">
      <div class="prose-page rich mx-auto max-w-4xl px-4 pt-10 pb-8 sm:px-6 md:pt-14">
        <header class="flex flex-col gap-4 pb-10">
          <!--@breadcrumb-->
          <h1 data-i18n="title"></h1>
          <p class="text-sm text-muted-foreground" data-i18n="updated"></p>
          <p class="lead" data-i18n="intro"></p>
          <p class="note" data-i18n="notice"></p>
        </header>
        <section aria-labelledby="a-built">
          <h2 id="a-built" data-i18n="built.title"></h2>
          <ul><li data-i18n="built.1"></li><li data-i18n="built.2"></li><li data-i18n="built.3"></li><li data-i18n="built.4"></li><li data-i18n="built.5"></li><li data-i18n="built.6"></li><li data-i18n="built.7"></li><li data-i18n="built.8"></li></ul>
        </section>
        <section aria-labelledby="a-checked">
          <h2 id="a-checked" data-i18n="checked.title"></h2>
          <p data-i18n="checked.intro"></p>
          <ul><li data-i18n="checked.1"></li><li data-i18n="checked.2"></li><li data-i18n="checked.3"></li><li data-i18n="checked.4"></li></ul>
        </section>
        <section aria-labelledby="a-unchecked">
          <h2 id="a-unchecked" data-i18n="unchecked.title"></h2>
          <ul><li data-i18n="unchecked.1"></li><li data-i18n="unchecked.2"></li><li data-i18n="unchecked.3"></li><li data-i18n="unchecked.4"></li><li data-i18n="unchecked.5"></li></ul>
        </section>
        <section aria-labelledby="a-limits">
          <h2 id="a-limits" data-i18n="limits.title"></h2>
          <ul><li data-i18n="limits.1"></li><li data-i18n="limits.2"></li><li data-i18n="limits.3"></li><li data-i18n="limits.4"></li></ul>
        </section>
        <section aria-labelledby="a-settings">
          <h2 id="a-settings" data-i18n="settings.title"></h2>
          <p data-i18n="settings.p"></p>
        </section>
        <section aria-labelledby="a-contact">
          <h2 id="a-contact" data-i18n="contact.title"></h2>
          <p data-i18n="contact.p"></p>
          <ul><li data-i18n="contact.email"></li><li data-i18n="contact.phone"></li><li data-i18n="contact.issues"></li></ul>
        </section>
        <p class="border-t border-border pt-6 text-sm text-muted-foreground" data-i18n="disclaimer"></p>
      </div>
    </main>

    <!--@footer-->
    <script type="module" src="/src/page.ts"></script>
  </body>
</html>
